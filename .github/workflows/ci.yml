name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check grokking_diag scripts

      - name: Type check (mypy)
        run: mypy grokking_diag --ignore-missing-imports
        continue-on-error: true

      - name: Run unit tests
        run: pytest -v tests/

      - name: Verify numerical claims (no GPU)
        run: python scripts/verify_numerical_claims.py --skip-gpu

  lean-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean_proofs
          build: true
          build-args: Diagnostics
          use-mathlib-cache: true
